syntax = "proto3";

package ai.v1;
option go_package = "github.com/cp25sy5-modjot/proto/gen/ai/v1;aiwpb";

// AI Wrapper Service Definition
service AiWrapperService {
  /// Performs a health check and returns the health status of the service.
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
  /// Extracts text from the provided image data.
  rpc ExtractTextFromImage(ExtractTextRequest) returns (ExtractTextResponse);
  /// Builds a transaction from the provided text input.
  rpc BuildTransactionFromText(BuildTransactionFromTextRequest) returns (TransactionResponseV2);
  /// Builds a transaction from the provided image data.
  rpc BuildTransactionFromImage(BuildTransactionFromImageRequest) returns (TransactionResponseV2);
}

message ExtractTextRequest {
  bytes image_data = 1;
}

message ExtractTextResponse {
  string extracted_text = 1;
}

message BuildTransactionFromTextRequest {
  string text_to_analyze = 1;
  repeated string categories = 2;
}

message BuildTransactionFromImageRequest {
  bytes image_data = 1;
  repeated string categories = 2;
}

message TransactionResponseV2 {
  string title = 1;
  string date = 2;        
  string type = 3; // manual | upload
  repeated TransactionItem items = 4;
}

message TransactionItem {
  string title = 1;
  double price = 2;
  string category = 3;
}

message HealthCheckRequest {
  string name = 1;
}

message HealthCheckResponse {
  bool healthy = 1;
  string message = 2;
} 